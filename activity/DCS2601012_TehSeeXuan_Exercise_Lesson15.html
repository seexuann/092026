<!DOCTYPE html>
<html><head>
<title>Form - Text Input</title>
<link rel=icon href= sunflower.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<style>

body {
top-margin:50;
}

td.title {
background-color:black;
color:white;
font-family:Times New Roman;
padding:12px;
width:40%;
}

td {
padding:12px;
}

form {
background-color:powderblue;
color=#696969;font-family:verdana;
text-align:left;
width:50%;height=40%;
}

p.heading {
text-align:center;
font-size:160%;
font-weight:bold;
}

</style>
</head>
<body>
<center>

<br>
<p class='heading'>Personal details:</p>
<form>
<table>
<tr>
<p>
<td class='title'>First Name: </td>
<td><input type=text name=fname></td>
</tr>
<tr>
<td class='title'>Last Name: </td>
<td><input type=text name=lname></td>
</tr>
<tr>
<td class='title'>Gender: </td>
<td><input type = radio name = gender value = Male> Male
<input type = radio name = gender value = Female> Female</td>
</tr>
<tr>
<td class='title'>Choose your favorite subjects:</td>
<td><input type=checkbox name=fav_sub value=DCS4103>DCS4103
<input type=checkbox name=fav_sub value=DCS3003>DCS3003
<input type=checkbox name=fav_sub value=MST1003>MST1003
<input type=checkbox name=fav_sub value=MST2003>MST2003</td>
</tr>
<tr>
<td class='title'>Address:</td>
<td><textarea rows=4 cols=30 name=address></textarea></td>
</tr>
<tr>
<td class='title'>Date of birth:</td>
<td><input type=date name=dob></td>
</tr>
<tr>
<td class='title'>Login password:</td>
<td><input type=password name=loginpass></td>
<tr>
<td class='title'>
Course:
</td>
<td>
<select>
<option value="0"> - List of Courses - </option>

<optgroup label="Diploma In Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>

<option value="DIB">Diploma In Business</option>
<option value="DAS">Diploma In Airline Services</option>
</select>
</td>
</tr>
</table>
</form>

<tr>
<td></td>
<td><br><br><br><input type=submit value=Submit><input type=reset value=Reset></td>
</tr>
</p>
</center>
</body></html>
