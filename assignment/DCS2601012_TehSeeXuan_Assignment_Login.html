<script>
function bigButton(x) {
 x.style.height = "40px";
 x.style.width = "90px";
 x.style.backgroundColor = "#f5ebd0";
}

function normalButton(x) {
 x.style.height = "30px";
 x.style.width = "80px";
 x.style.backgroundColor = "#fae5ac";
}

function validateForm() {
 let x = document.LoginForm.username.value;
 let y = document.LoginForm.password.value;
 if ((x == "") || (y == "")) 
 {
   alert("Please enter your details.");
   return false;

 } else {
   alert("Successfully logged in");
   window.location.replace("DCS2601012_TehSeeXuan_Project_Main.html");
   return true;
}

}

function toggleMenu() {
 var x = document.getElementById("myMenu");

 if (x.style.display === "flex") {
  x.style.display = "";
 } else {
  x.style.display = "flex";
 }
}

</script>

<style>
body {

background-size:cover;
}

header {

nav a {

main {

}

footer {

padding:15px;
}

p.underline {
text-decoration:underline;

}

.menu-button {

}

@media screen and (max-width:600px) {

.menu-button {
display:block;
}

nav {
display:none;
flex-direction:column;
}

nav a {
text-align:left;
padding: 2px 30px;
border: 1px solid white;
}

}

</style>
